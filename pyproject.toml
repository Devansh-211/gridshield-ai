[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridshield-ai"
version = "1.0.0"
description = "Explainable Cyber-Physical Power Grid Resilience Twin"
readme = "README.md"
authors = [{ name = "Devansh-211" }]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "pandapower>=2.14.0",
    "networkx>=3.3",
    "sse-starlette>=2.1.3",
    "google-genai>=1.0.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "backend/tests",
]
pythonpath = [
    "."
]
filterwarnings = [
    "ignore:.*numba cannot be imported.*:UserWarning",
    "ignore:.*Trying to unpickle estimator.*:sklearn.exceptions.InconsistentVersionWarning",
    "ignore:.*Pydantic serializer warnings.*:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
